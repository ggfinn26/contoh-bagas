<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Landing page modern dengan Tailwind CSS">
    <title>INI HALAMAN AWAL BAGAS</title>
    <!-- CSS Tailwind Output -->
    <link rel="stylesheet" href="css/output.css">
    
    <!-- Modern Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="antialiased text-brand-primary bg-brand-light scroll-smooth">
    
    <!-- Semantic Header -->
    <header class="w-full sticky top-0 bg-brand-light/90 backdrop-blur-lg border-b border-brand-tertiary/30 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo (Brutalist Style) -->
                <div class="flex-shrink-0 flex items-center transform scale-[0.55] origin-left -ml-2 hover:scale-[0.6] transition-transform duration-300">
                    <a href="#" class="brutalist-button openai" aria-label="Home">
                        <div class="openai-logo">
                            <img src="logo.svg" alt="Ad Meliora Logo" class="openai-icon rounded-full object-cover">
                        </div>
                        <div class="button-text w-full px-1">
                            <span class="!text-[12px] truncate w-full text-center">ad meliora</span>
                            <span class="!text-[9.5px] !tracking-tight truncate w-full text-center">coffe & eatery</span>
                        </div>
                    </a>
                </div>
                
                <!-- Desktop Menu -->
                <nav class="hidden md:flex space-x-1" aria-label="Main Navigation">
                    <a href="#section1" class="px-4 py-2 rounded-full text-brand-primary hover:text-white hover:bg-brand-secondary font-medium transition-all duration-200">Menu 1</a>
                    <a href="#section2" class="px-4 py-2 rounded-full text-brand-primary hover:text-white hover:bg-brand-secondary font-medium transition-all duration-200">Menu 2</a>
                    <a href="#section3" class="px-4 py-2 rounded-full text-brand-primary hover:text-white hover:bg-brand-secondary font-medium transition-all duration-200">Menu 3</a>
                    <a href="#section4" class="px-4 py-2 rounded-full text-brand-primary hover:text-white hover:bg-brand-secondary font-medium transition-all duration-200">Menu 4</a>
                </nav>

                <!-- Mobile Menu Button -->
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" type="button" aria-expanded="false" aria-label="Toggle menu" class="p-2 rounded-md text-brand-primary hover:text-white hover:bg-brand-secondary focus:outline-none transition-colors">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu (Hidden by default) -->
        <div id="mobile-menu" class="hidden md:hidden bg-brand-light border-t border-brand-tertiary/30 shadow-xl absolute w-full left-0">
            <nav class="px-4 pt-4 pb-6 space-y-2" aria-label="Mobile Navigation">
                <a href="#section1" class="block px-4 py-3 text-base font-medium text-brand-primary hover:text-white hover:bg-brand-secondary rounded-xl transition-colors">Menu 1</a>
                <a href="#section2" class="block px-4 py-3 text-base font-medium text-brand-primary hover:text-white hover:bg-brand-secondary rounded-xl transition-colors">Menu 2</a>
                <a href="#section3" class="block px-4 py-3 text-base font-medium text-brand-primary hover:text-white hover:bg-brand-secondary rounded-xl transition-colors">Menu 3</a>
                <a href="#section4" class="block px-4 py-3 text-base font-medium text-brand-primary hover:text-white hover:bg-brand-secondary rounded-xl transition-colors">Menu 4</a>
            </nav>
        </div>
    </header>

    <!-- Semantic Main Content Area -->
    <main>
        <!-- Placeholder Sections -->
        <section id="section1" class="min-h-screen flex items-center justify-center relative overflow-hidden bg-brand-tertiary/10">
            <div class="text-center relative z-10 p-8">
                <h1 class="text-5xl md:text-6xl font-bold text-brand-primary tracking-tight mb-4">Section 1</h1>
                <p class="text-xl text-brand-secondary">Konten untuk Menu 1</p>
            </div>
        </section>
        
        <section id="section2" class="min-h-screen flex items-center justify-center bg-brand-light">
            <div class="text-center p-8">
                <h1 class="text-5xl md:text-6xl font-bold text-brand-primary tracking-tight mb-4">Section 2</h1>
                <p class="text-xl text-brand-secondary">Konten untuk MEMASAK</p>
            </div>
        </section>
        
        <section id="section3" class="min-h-screen flex items-center justify-center relative overflow-hidden bg-brand-tertiary/10">
            <div class="text-center relative z-10 p-8">
                <h1 class="text-5xl md:text-6xl font-bold text-brand-primary tracking-tight mb-4">Section 3</h1>
                <p class="text-xl text-brand-secondary">Konten untuk Menu 3</p>
            </div>
        </section>
        
        <section id="section4" class="min-h-screen flex items-center justify-center bg-brand-light">
            <div class="text-center p-8">
                <h1 class="text-5xl md:text-6xl font-bold text-brand-primary tracking-tight mb-4">Section 4</h1>
                <p class="text-xl text-brand-secondary">Konten untuk Menu 4</p>
            </div>
        </section>
    </main>

    <!-- External Script -->
    <script src="js/main.js"></script>
</body>
</html>
